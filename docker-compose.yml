services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: uc_shop
      POSTGRES_USER: uc_shop
      POSTGRES_PASSWORD: uc_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uc_shop -d uc_shop"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-1:
    image: apache/kafka:3.7.0
    hostname: kafka-1
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-2:
    image: apache/kafka:3.7.0
    hostname: kafka-2
    ports:
      - "39092:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:39092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-2:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-3:
    image: apache/kafka:3.7.0
    hostname: kafka-3
    ports:
      - "49092:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:49092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-3:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092
      --create --if-not-exists --topic orders.paid --partitions 96 --replication-factor 3 --config min.insync.replicas=2 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092
      --create --if-not-exists --topic orders.retry.1s --partitions 96 --replication-factor 3 --config min.insync.replicas=2 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092
      --create --if-not-exists --topic orders.retry.3s --partitions 96 --replication-factor 3 --config min.insync.replicas=2 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092
      --create --if-not-exists --topic orders.retry.5s --partitions 96 --replication-factor 3 --config min.insync.replicas=2 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092
      --create --if-not-exists --topic orders.dlq --partitions 12 --replication-factor 3 --config min.insync.replicas=2"

  order-api:
    build: .
    command: uvicorn order_pipeline.app.api.main:app --host 0.0.0.0 --port 8000 --workers ${ORDER_API_WORKERS:-1}
    restart: unless-stopped
    environment: &app-env
      DATABASE_URL: postgresql://uc_shop:uc_shop@postgres:5432/uc_shop
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      ORDERS_PAID_TOPIC: orders.paid
      ORDERS_RETRY_TOPICS: orders.retry.1s,orders.retry.3s,orders.retry.5s
      RETRY_DELAYS_SECONDS: 1,3,5
      ORDERS_DLQ_TOPIC: orders.dlq
      POSTGRES_POOL_MIN_SIZE: 2
      POSTGRES_POOL_MAX_SIZE: 10
    ports:
      - "${ORDER_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  outbox-relay:
    build: .
    command: python -m order_pipeline.app.outbox.main
    restart: unless-stopped
    environment:
      <<: *app-env
      OUTBOX_BATCH_SIZE: 50
      OUTBOX_CONCURRENCY: 10
      POSTGRES_POOL_MAX_SIZE: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  order-processor:
    build: .
    command: python -m order_pipeline.app.consumer.main
    restart: unless-stopped
    environment:
      <<: *app-env
      ORDER_CONSUMER_GROUP: uc-shop-order-processors
      ORDER_PROCESSING_STALE_SECONDS: 600
      ORDER_MAX_ATTEMPTS: 5
      ORDER_CONSUMER_BATCH_SIZE: 500
      ORDER_CONSUMER_CONCURRENCY: 80
      ORDER_CONSUMER_POLL_MS: 500
      POSTGRES_POOL_MAX_SIZE: 15
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
