services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: order_processor_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - order_processor_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: order_processor_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - order_processor_network

  worker:
    deploy:
      mode: replicated
      replicas: 3
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m consumer.worker
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUMER_NAME=worker_1
      - MAX_PARALLEL_ORDERS=5
      - LOG_LEVEL=INFO
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - order_processor_network

  # producer:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: order_processor_producer
  #   command: python -m producer.producer
  #   environment:
  #     - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  #     - LOG_LEVEL=INFO
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   networks:
  #     - order_processor_network

volumes:
  kafka_data:
    driver: local

networks:
  order_processor_network:
    driver: bridge
