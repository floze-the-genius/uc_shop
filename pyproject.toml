[project]
name = "uc-shop-kafka-order-pipeline"
version = "0.1.0"
description = "Kafka-based alternative for asynchronous UC Shop order processing"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.10,<1",
  "asyncpg>=0.29,<1",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
